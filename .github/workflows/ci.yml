name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [22]
        svelte: [3.x, 4.x, 5.x]
        fontawesome:
          - { core: 7.x, icons: 5.x }
          - { core: 6.x, icons: 6.x }
          - { core: 7.x, icons: 7.x }

    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node }}
      - name: npm install, build, and test
        run: |
          npm install
          npm run build
          npm install --no-save svelte@${{ matrix.svelte }}
          npm install --force --no-save @fortawesome/fontawesome-svg-core@${{ matrix.fontawesome.core }} @fortawesome/free-solid-svg-icons@${{ matrix.fontawesome.icons }}
          npm list svelte @fortawesome/fontawesome-svg-core @fortawesome/free-solid-svg-icons
          npm run lint
          npm run test
      - name: dist
        run: |
          npm run dist
